[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sr-filtering-nqs"
version = "0.1.0"
description = "Anonymous review package for SR-filtering neural quantum state experiments"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.6",
    "flax",
    "jax>=0.4.35,<0.8",
    "matplotlib>=3.8",
    "netket>=3.19.0",
    "neural-tangents",
    "nqxpack",
    "numpy",
    "optax",
    "orbax-checkpoint<=0.11.27",
    "pandas",
    "scipy",
    "sparse>=0.15",
    "tensorstore>=0.1.69,!=0.1.72",
]

[tool.setuptools.packages.find]
where = ["src"]
